name: what-dish-to-cook-today

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    #No auth: Mongo publishes no port, so only containers on this network can reach it.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  libretranslate:
    image: libretranslate/libretranslate:v1.6.5
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,vi
      LT_UPDATE_MODELS: "false"
    volumes:
      - translate-models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    #Starts the server, waits for it, then pulls the embedding model once. The
    #named volume keeps the download across restarts.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        server_pid=$$!
        until /bin/ollama list >/dev/null 2>&1; do sleep 2; done
        /bin/ollama pull "$${EMBED_MODEL:-bge-m3}"
        wait "$$server_pid"
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s

  server:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      libretranslate:
        condition: service_started
      ollama:
        condition: service_started
    ports:
      #Change the host side with SERVER_PORT when 3000 is taken; the container keeps 3000.
      - "${SERVER_PORT:-3000}:3000"
    environment:
      #Compose reads the same variables from a root .env file; see .env.example.
      #No fallback: a predictable secret would let anyone forge a session cookie.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      #No directConnection: the driver resolves the container name.
      MONGODB_URI: mongodb://mongo:27017/what_dish_to_cook_today
      #Must include this site's own public origin: the built assets send an Origin header.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      #Empty means no boot promotion. Set it to an account that already exists.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      BACKUP_DIR: /app/backups
      TRANSLATE_URL: ${TRANSLATE_URL:-http://libretranslate:5000/translate}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-opencode-go}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-v4.1-flash}
      AI_BASE_URL: ${AI_BASE_URL:-https://opencode.ai/inference/go/openai/v1}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      #Pulled by the ollama service on first start; local to this network.
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      AI_DAILY_MESSAGE_LIMIT: ${AI_DAILY_MESSAGE_LIMIT:-20}
      AI_MAX_TOOL_ROUNDS: ${AI_MAX_TOOL_ROUNDS:-3}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-10}
      #A cold bge-m3 load on CPU can exceed five seconds; fifteen is the floor.
      AI_EMBED_TIMEOUT_MS: ${AI_EMBED_TIMEOUT_MS:-15000}
      MAINTENANCE_DISABLED: ${MAINTENANCE_DISABLED:-0}
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - backup-data:/app/backups
      #Only gallery: mounting all of /app/public hides pictures, templates and the defaults.
      - gallery:/app/public/gallery
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
  backup-data:
  gallery:
  translate-models:
  ollama-models:
